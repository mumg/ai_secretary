[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "improver-server"
version = "0.1.1"
description = "Local communication-to-task server"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.19.2",
  "asyncpg==0.31.0",
  "beautifulsoup4==4.14.3",
  "cryptography==50.0.1",
  "exchangelib==5.6.0",
  "fastapi==0.141.1",
  "firebase-admin==7.2.0",
  "holidays==0.104",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "regex==2026.9.10",
  "SQLAlchemy==2.0.52",
  "structlog==25.5.0",
  "tenacity==9.1.4",
  "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
improver = ["version", "web/*.html", "web/assets/*.css", "web/assets/*.js", "web/assets/*.txt", "web/downloads/*.zip"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "ASYNC240"]
