<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Серкетарь — робот-секретарь</title>
  <desc id="desc">Дружелюбный робот в пиджаке и галстуке, созданный на основе силуэта секретаря.</desc>
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="#0B2028"/>
  <path d="M56 194h42m-21-21v42M414 142h42m-21-21v42M414 340h42m-21-21v42"
        fill="none" stroke="#2B5E62" stroke-width="8" stroke-linecap="round" opacity=".55"/>

  <g transform="translate(30.72 30.72) scale(.88)">
  <!-- Антенна -->
  <path d="M256 99V66" stroke="#82F4C1" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="55" r="13" fill="#82F4C1" filter="url(#glow)"/>

  <!-- Силуэт причёски-гарнитуры из исходной иконки -->
  <path d="M137 254V177c0-72 50-121 119-121 35 0 64 11 87 33 45 7 77 43 77 91v82c0 12-10 22-22 22-25 0-45-6-61-18-20 29-48 44-81 44-35 0-64-15-84-45-8 10-20 17-35 19-12 1-22-8-22-20 0-5 8-7 22-10Z"
        fill="#0C2028" stroke="#3FD6AA" stroke-width="12" stroke-linejoin="round"/>

  <!-- Ушные панели -->
  <rect x="118" y="180" width="44" height="76" rx="20" fill="#173B43" stroke="#82F4C1" stroke-width="8"/>
  <rect x="350" y="180" width="44" height="76" rx="20" fill="#173B43" stroke="#82F4C1" stroke-width="8"/>

  <!-- Лицевая панель -->
  <rect x="158" y="94" width="196" height="202" rx="82" fill="#D9F1ED" stroke="#071116" stroke-width="10"/>
  <path d="M164 145c23-39 56-58 99-58 34 0 64 12 89 37v38c-35-2-68-14-95-36-17 15-49 24-93 27v-8Z"
        fill="#173B43"/>

  <!-- Глаза и дружелюбная индикация -->
  <rect x="195" y="176" width="36" height="28" rx="14" fill="#092027"/>
  <rect x="281" y="176" width="36" height="28" rx="14" fill="#092027"/>
  <circle cx="216" cy="188" r="6" fill="#82F4C1" filter="url(#glow)"/>
  <circle cx="296" cy="188" r="6" fill="#82F4C1" filter="url(#glow)"/>
  <path d="M216 235c12 11 25 16 40 16s28-5 40-16" fill="none" stroke="#17675D" stroke-width="9" stroke-linecap="round"/>
  <path d="M181 218h-15m180 0h-15" stroke="#3FD6AA" stroke-width="7" stroke-linecap="round" opacity=".85"/>

  <!-- Шея и корпус секретаря -->
  <path d="M219 286v43c0 20 15 35 37 35s37-15 37-35v-43" fill="#B9D8D4" stroke="#071116" stroke-width="10"/>
  <path d="M92 480v-65c0-59 46-105 105-105h25c4 36 13 54 34 54s30-18 34-54h25c59 0 105 46 105 105v65H92Z"
        fill="#173B43" stroke="#3FD6AA" stroke-width="12" stroke-linejoin="round"/>
  <path d="M198 316l58 48-57 82-37-57 36-73Zm116 0-58 48 57 82 37-57-36-73Z"
        fill="#E7F7F3" stroke="#071116" stroke-width="9" stroke-linejoin="round"/>
  <path d="M256 364l26 35-26 68-26-68 26-35Z" fill="#3FD6AA" stroke="#071116" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="142" cy="442" r="11" fill="#82F4C1" opacity=".9"/>
  <path d="M370 427h32m-16-16v32" stroke="#82F4C1" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
