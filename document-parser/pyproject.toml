[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "improver-document-parser"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "openpyxl==3.1.5",
  "pypdf==6.7.5",
  "python-docx==1.2.0",
  "python-multipart==0.0.22",
  "uvicorn==0.41.0",
]

[tool.setuptools]
py-modules = ["main"]

