name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Опубликовать подписанный APK в GitHub Releases'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Tests and clean debug build
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Release metadata tests
        run: python3 -m unittest discover -s android/scripts -p 'test_*.py' -v
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          for key in ('KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'):
              if not os.environ.get(key):
                  raise SystemExit(f'Missing Android signing secret: {key}')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-release.jks'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          path.chmod(0o600)
          if os.environ.get('GOOGLE_SERVICES'):
              pathlib.Path('android/app/google-services.json').write_bytes(base64.b64decode(os.environ['GOOGLE_SERVICES'], validate=True))
          PY
      - name: Build signed release
        working-directory: android
        env:
          SECRETARY_SIGNING_STORE_FILE: ${{ runner.temp }}/android-release.jks
          SECRETARY_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRETARY_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRETARY_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:lintRelease --no-daemon --no-configuration-cache
      - name: Verify APK signature and public contents
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          python3 - <<'PY'
          import pathlib, zipfile
          apk = pathlib.Path('android/app/build/outputs/apk/release/app-release.apk')
          with zipfile.ZipFile(apk) as archive:
              assert not any(n.lower().endswith(('.p12', '.pfx', '.jks', '.keystore', '.key', '.pem')) for n in archive.namelist()), 'Private identity in APK'
          config = pathlib.Path('android/app/build/generated/source/buildConfig/release/net/muratov/assistant/BuildConfig.java').read_text()
          assert 'DEFAULT_SERVER_URL = "";' in config, 'Release has a default server'
          assert 'CLIENT_CERT_RESOURCE = "";' in config and 'CLIENT_CERT_PASSWORD = "";' in config
          PY
      - name: Prepare public files
        id: metadata
        run: python3 android/scripts/release_metadata.py
      - name: Publish versioned release and update channel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          CODE: ${{ steps.metadata.outputs.code }}
        run: |
          set -euo pipefail
          # Keep the original signed APK on a retry of the same commit.
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/android-existing"
            gh release download "$TAG" -p android-update.json -D "$RUNNER_TEMP/android-existing"
            python3 - <<'PY'
          import json, os, pathlib, shutil
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-existing/android-update.json'
          data = json.loads(path.read_text())
          assert data.get('revision') == os.environ['GITHUB_SHA'] and data['versionCode'] == int(os.environ['CODE']), 'Release belongs to another commit; increase the Android version'
          shutil.copyfile(path, 'dist/android/android-update.json')
          PY
          else
            gh release create "$TAG" dist/android/* --target "$GITHUB_SHA" --title "Android $VERSION ($CODE)" --notes "Подписанное приложение AI Секретарь для Android 8.0+. При первом запуске откроется мастер подключения к вашему серверу." --latest=false
          fi
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --target "$GITHUB_SHA" --title 'Android — актуальная версия' --notes 'Манифест для автоматического обновления Android-приложения. APK доступен в версионном Android-релизе.' --prerelease --latest=false
          fi
          # Refuse an accidental downgrade of the shared update channel.
          mkdir -p "$RUNNER_TEMP/android-channel"
          if gh release view android-latest --json assets --jq '.assets[].name' | grep -qx android-update.json; then
            gh release download android-latest -p android-update.json -D "$RUNNER_TEMP/android-channel"
          fi
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-channel/android-update.json'
          if path.exists() and json.loads(path.read_text())['versionCode'] > int(os.environ['CODE']):
              raise SystemExit('The update channel already has this or a newer versionCode')
          PY
          gh release upload android-latest dist/android/android-update.json --clobber
          gh release edit android-latest --notes "Последняя версия: Android $VERSION ($CODE). Скачать APK: https://github.com/mumg/ai_secretary/releases/download/$TAG/ai-secretary-$VERSION.apk"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks" android/app/google-services.json
