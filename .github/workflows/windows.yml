name: Windows installer

on:
  push:
    branches: [main]
    paths: ['windows/**', 'macos/**', 'backend/**', 'browser-extension/**', 'document-parser/**', 'version', 'llm_manifest.json', 'scripts/update_llm_manifest.py', '.gitattributes', '.github/workflows/windows.yml']
    tags: ['windows-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Опубликовать установщик в GitHub Releases'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-installer-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      source_run: ${{ steps.reuse.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate LLM prompt manifest
        run: python3 scripts/update_llm_manifest.py --check
      - name: Validate release version
        id: mode
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          python3 windows/build.py --check-version
          release_version="$(tr -d '\r\n' < version)"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != "refs/tags/windows-v$release_version" ]]; then
            echo 'Windows tag must match root version'; exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Publish only from main'; exit 1
          fi
          publish=false
          if [[ "$PUBLISH" == true || "$GITHUB_REF" == refs/tags/windows-v* ]]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Find a tested installer for this commit
        id: reuse
        uses: actions/github-script@v8
        with:
          script: |
            await require('./windows/find-artifact.cjs')({ github, context, core });

  build:
    needs: prepare
    if: needs.prepare.outputs.source_run == ''
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: |
            backend/go.sum
            document-parser/go.sum
            windows/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: macos/package-lock.json
      - name: Install Electron tooling and test SSO isolation
        shell: pwsh
        run: |
          npm ci --prefix macos --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Electron dependencies failed' }
          npm test --prefix macos
          if ($LASTEXITCODE -ne 0) { throw 'Electron/SSO tests failed' }
          node --test windows/tests/artifact.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Artifact reuse tests failed' }
      - name: Go document parser tests on Windows
        working-directory: document-parser
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go parser vet failed' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go parser tests failed' }
      - name: Go setup helper tests
        working-directory: windows
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Setup helper vet failed' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Setup helper tests failed' }
      - name: Build tooling tests
        shell: pwsh
        run: |
          python -m unittest discover -s windows/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Installer tests failed' }
      - name: Test Unicode shortcut inspection
        shell: pwsh
        run: ./windows/tests/test-shortcuts.ps1
      - name: Install compiler
        shell: pwsh
        run: |
          python -c "import sys,json; from pathlib import Path; sys.path.insert(0,'windows'); import build; build.verified_download(json.loads(Path('windows/vendor.json').read_text(encoding='utf-8'))['innosetup'],Path('dist/windows/vendor'))"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler checksum verification failed' }
          $Install = Start-Process -FilePath dist/windows/vendor/innosetup.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS' -Wait -PassThru
          if ($Install.ExitCode -notin @(0, 3010)) { throw 'Inno Setup installation failed' }
      - name: Build offline EXE
        shell: pwsh
        run: ./windows/build.ps1
      - name: Verify installation, services, shortcuts and data preservation (Server 2022)
        shell: pwsh
        run: ./windows/smoke-test.ps1
      - name: Record tested installer provenance
        shell: pwsh
        run: |
          python windows/artifact.py create --sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Installer provenance creation failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer-tested
          path: |
            dist/windows/AI-Secretary-Setup-*-windows-x64.exe
            dist/windows/SHA256SUMS
            dist/windows/artifact.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.publish == 'true' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.prepare.outputs.source_run != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer-tested
          path: dist/windows
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.source_run || github.run_id }}
      - name: Verify commit, version and installer checksum
        run: python3 windows/artifact.py verify --sha "$GITHUB_SHA"
      - name: Publish tested installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat version | tr -d '\r\n')"
          tag="windows-v$version"
          gh release create "$tag" "dist/windows/AI-Secretary-Setup-$version-windows-x64.exe" dist/windows/SHA256SUMS --target "$GITHUB_SHA" --title "Windows $version" --notes "Установщик AI Секретаря для Windows x64. Включает Go-бинарники, PostgreSQL и службы Windows; Python не требуется. Настройка через мастер; Docker не требуется. См. windows/README.md. EXE пока не подписан сертификатом Authenticode." --latest=false
