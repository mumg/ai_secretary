name: Windows installer

on:
  push:
    branches: [main]
    paths: ['windows/**', 'macos/**', 'backend/**', 'browser-extension/**', 'document-parser/**', 'version', '.gitattributes', '.github/workflows/windows.yml']
    tags: ['windows-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Опубликовать установщик в GitHub Releases'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: |
            backend/go.sum
            document-parser/go.sum
            windows/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: macos/package-lock.json
      - name: Install Electron tooling and test SSO isolation
        shell: pwsh
        run: |
          npm ci --prefix macos --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Electron dependencies failed' }
          npm test --prefix macos
          if ($LASTEXITCODE -ne 0) { throw 'Electron/SSO tests failed' }
      - name: Validate release version
        shell: pwsh
        run: |
          $Version = (Get-Content version -Raw).Trim()
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF -ne "refs/tags/windows-v$Version") { throw 'Windows tag must match root version' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publish only from main' }
      - name: Go document parser tests on Windows
        working-directory: document-parser
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go parser vet failed' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go parser tests failed' }
      - name: Go setup helper tests
        working-directory: windows
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Setup helper vet failed' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Setup helper tests failed' }
      - name: Build tooling tests
        shell: pwsh
        run: |
          python -m unittest discover -s windows/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Installer tests failed' }
      - name: Install compiler
        shell: pwsh
        run: |
          python -c "import sys,json; from pathlib import Path; sys.path.insert(0,'windows'); import build; build.verified_download(json.loads(Path('windows/vendor.json').read_text(encoding='utf-8'))['innosetup'],Path('dist/windows/vendor'))"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler checksum verification failed' }
          $Install = Start-Process -FilePath dist/windows/vendor/innosetup.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS' -Wait -PassThru
          if ($Install.ExitCode -notin @(0, 3010)) { throw 'Inno Setup installation failed' }
      - name: Build offline EXE
        shell: pwsh
        run: ./windows/build.ps1
      - name: Verify Electron, services, uninstall/reinstall and data preservation (Server 2022)
        shell: pwsh
        run: ./windows/smoke-test.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist/windows/AI-Secretary-Setup-*-windows-x64.exe
            dist/windows/SHA256SUMS
          retention-days: 14

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/windows-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist/windows
      - name: Publish tested installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat version | tr -d '\r\n')"
          tag="windows-v$version"
          gh release create "$tag" dist/windows/* --target "$GITHUB_SHA" --title "Windows $version" --notes "Установщик AI Секретаря для Windows x64. Включает Go-бинарники, PostgreSQL и службы Windows; Python не требуется. Настройка через мастер; Docker не требуется. См. windows/README.md. EXE пока не подписан сертификатом Authenticode." --latest=false
