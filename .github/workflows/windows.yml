name: Windows installer

on:
  push:
    branches: [main]
    paths: ['windows/**', 'backend/**', 'browser-extension/**', 'document-parser/**', 'version', '.github/workflows/windows.yml']
    tags: ['windows-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Опубликовать установщик в GitHub Releases'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'
      - name: Validate release version
        shell: pwsh
        run: |
          $Version = (Get-Content version -Raw).Trim()
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF -ne "refs/tags/windows-v$Version") { throw 'Windows tag must match root version' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publish only from main' }
      - name: Unit tests
        shell: pwsh
        run: |
          python -m pip install cryptography==50.0.1
          python -m unittest discover -s windows/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Installer tests failed' }
      - name: Install compiler
        shell: pwsh
        run: |
          python -c "import sys,json; from pathlib import Path; sys.path.insert(0,'windows'); import build; build.verified_download(json.loads(Path('windows/vendor.json').read_text())['innosetup'],Path('dist/windows/vendor'))"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler checksum verification failed' }
          $Install = Start-Process -FilePath dist/windows/vendor/innosetup.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS' -Wait -PassThru
          if ($Install.ExitCode -notin @(0, 3010)) { throw 'Inno Setup installation failed' }
      - name: Build offline EXE
        shell: pwsh
        run: ./windows/build.ps1
      - name: Verify install, upgrade and uninstall
        shell: pwsh
        run: ./windows/smoke-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/windows/AI-Secretary-Setup-*-windows-x64.exe
            dist/windows/SHA256SUMS
          retention-days: 14

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/windows-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/windows
      - name: Publish tested installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat version | tr -d '\r\n')"
          tag="windows-v$version"
          gh release create "$tag" dist/windows/* --target "$GITHUB_SHA" --title "Windows $version" --notes "Установщик AI Секретаря для Windows x64. Включает Python, PostgreSQL и службы Windows. Настройка через мастер; Docker не требуется. См. windows/README.md. EXE пока не подписан сертификатом Authenticode." --latest=false
