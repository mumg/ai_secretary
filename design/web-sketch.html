<style>
:root{color-scheme:dark;--bg:#0b1015;--panel:#121a21;--card:#19232b;--line:#2a3741;--muted:#99aab6;--text:#e4ecef;--green:#8bd7af;--blue:#8bcadd;--amber:#ebc07a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:transparent;border-radius:9px;padding:9px 14px}button:hover{background:#25343c}button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:3px}button.active{color:var(--green);border-color:var(--green)}.primary{background:var(--green);color:#10281d;border-color:var(--green)}.primary:hover{background:#b1e9ca}header{height:80px;display:flex;align-items:center;gap:28px;padding:0 32px;background:var(--panel);border-bottom:1px solid var(--line)}.brand{font-size:22px;letter-spacing:-.8px;font-weight:650}.brand span{color:var(--green)}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}.top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}.health{font-size:13px;white-space:nowrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:8px}.sketch{padding:3px 8px;border:1px dashed #53616d;border-radius:5px;color:var(--muted);font-size:11px}nav{display:flex;gap:28px;padding:0 32px;background:var(--panel);border-bottom:1px solid var(--line)}nav button{border:0;border-radius:0;padding:18px 0;color:var(--muted);border-bottom:2px solid transparent}nav button.active{border-bottom-color:var(--green)}nav small{font-size:11px;background:#26323a;color:#b9c6cd;padding:1px 6px;margin-left:6px;border-radius:5px}.workspace{max-width:1600px;margin:auto;padding:28px 32px 12px}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}h1{font-size:27px;letter-spacing:-.7px;margin:0 0 3px;font-weight:600}p{margin:0 0 15px}.muted{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:minmax(300px, .85fr) minmax(430px,1.4fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;height:calc(100dvh - 280px);min-height:480px}.list-pane{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;background:#10171d}.toolbar{padding:18px;border-bottom:1px solid var(--line)}.search{position:relative}.search span{position:absolute;left:12px;top:8px;color:var(--muted);font-size:20px}input{height:42px;width:100%;padding:8px 12px 8px 38px;border:1px solid #3c4b56;border-radius:8px;background:var(--bg);color:var(--text);outline:none}input:focus{border-color:var(--green)}.list-meta{display:flex;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:12px}.list-meta button{font-size:12px;border:0;padding:0}.scroll-list{overflow:auto;padding:0 14px 18px;flex:1}.group{display:flex;justify-content:space-between;padding:16px 3px 10px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}.item{display:block;text-align:left;width:100%;padding:15px;margin-bottom:9px;background:var(--card);border-radius:10px;border:1px solid var(--line)}.item.selected{border-color:#7abea1;background:#1c302c;box-shadow:inset 3px 0 var(--green)}.item .title{font-size:15px;font-weight:550;line-height:1.4;margin-bottom:7px}.item .sub{font-size:12px;color:var(--muted)}.item .preview{font-size:13px;color:#b7c6cf;margin:9px 0 0}.tag{display:inline-block;font-size:10px;letter-spacing:.3px;border-radius:4px;padding:2px 6px;color:var(--amber);background:#3a3227;margin-right:6px}.tag.blue{color:var(--blue);background:#203540}.tag.green{color:var(--green);background:#233c31}.detail{background:var(--panel);overflow:auto;padding:28px 32px}.detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.detail h2{font-size:25px;line-height:1.3;font-weight:580;letter-spacing:-.5px;margin:0 0 15px}.detail h3{font-size:16px;font-weight:600;margin:26px 0 12px}.detail-actions{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-bottom:1px solid var(--line);padding-bottom:22px}.fact{font-size:14px}.fact span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.callout{padding:16px 18px;border-left:2px solid var(--green);background:#1a2927;border-radius:0 8px 8px 0}.callout p{margin:0}.source{border:1px solid var(--line);border-radius:9px;padding:15px;background:#10181e}.source p{font-size:13px;color:#c0cdd5;margin:8px 0}.source button,.link{color:var(--green);padding:0;border:0;font-size:13px;text-decoration:underline;text-underline-offset:3px}.detail ul{padding-left:20px}.detail li{margin-bottom:10px}.back{display:none}.footer{display:flex;justify-content:space-between;color:#778b99;font-size:11px;padding:12px 2px;gap:15px}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.metric{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:10px}.metric strong{font-size:26px;display:block}.metric span{color:var(--muted);font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:11px;font-weight:500}th,td{padding:15px 12px;border-bottom:1px solid var(--line);vertical-align:top}.chat-answer{max-width:650px}.bubble{background:var(--card);border-radius:12px;padding:16px;margin:22px 0}.bubble.user{background:#1e362e;margin-left:60px}.composer{display:flex;gap:10px;margin-top:28px}.composer textarea{resize:vertical;min-height:78px;flex:1;min-width:0;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border:1px solid #466157;background:#21382f;border-radius:10px;z-index:20;box-shadow:0 8px 40px #0008;max-width:90vw}.hidden{display:none!important}.full{grid-template-columns:1fr}.full .list-pane{display:none}.full .detail{max-width:1100px;width:100%;margin:auto}.blank{padding:30px 0;color:var(--muted)}.mock-menu{position:absolute;right:32px;top:70px;z-index:5;background:var(--panel);padding:18px;border:1px solid var(--line);border-radius:10px;width:280px}.mock-menu button{display:block;margin-top:12px;width:100%;text-align:left}
/* Persistent Outlook-style reading pane. */
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{height:68px;flex-shrink:0;padding:0 24px}
.workspace{max-width:none;margin:0;padding:16px 20px 0;flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.layout{grid-template-columns:minmax(280px,.85fr) minmax(300px,1.4fr);height:auto;min-height:0;flex:1;min-width:580px}
.list-pane,.detail{min-width:0;min-height:0}
nav{padding:0 8px;gap:0;justify-content:space-between;flex-shrink:0}
nav button{font-size:12px;padding:15px 2px}nav small{display:none}
.page-heading{padding:20px 18px 0;margin-bottom:16px;flex-wrap:wrap;gap:12px}
h1{font-size:23px}.page-heading .primary{font-size:12px;padding:7px 10px}
.toolbar{padding:0 18px 16px}.detail{padding:24px 28px;overscroll-behavior:contain;overflow-wrap:anywhere}
.scroll-list{overscroll-behavior:contain}.detail-head{border-bottom:1px solid var(--line);padding-bottom:15px}
.footer{flex-shrink:0}.full{grid-template-columns:1fr}.full .detail{max-width:none;margin:0}
@media(max-width:1000px){header{padding:0 16px;gap:12px}.sketch,.health-label{display:none}.top-actions{gap:6px}.top-actions button{padding:8px 10px}.workspace{padding:10px 8px 0}.layout{grid-template-columns:minmax(280px,.85fr) minmax(300px,1.4fr)}.detail{padding:20px}.detail h2{font-size:22px}.facts{grid-template-columns:1fr;gap:10px}.page-heading{padding:16px 12px 0}.page-heading h1{font-size:20px}.toolbar{padding:0 12px 14px}.scroll-list{padding:0 8px 12px}.item{padding:12px}.footer span:last-child{display:none}.status-grid{gap:6px}.metric{padding:10px}.metric strong{font-size:22px}}
</style>

<body>
<header><div class="brand"><span>◈</span> Секретарь</div><span class="sketch">СКЕТЧ / 02</span><div class="top-actions"><button class="health" id="health" title="Открыть состояние компонентов"><span class="dot"></span><span class="health-label">Система в норме</span></button><button id="chat">Чат с Qwen ↗</button><button id="settings" aria-label="Настройки">⚙</button></div></header>
<main class="workspace"><div class="layout" id="layout"><aside class="list-pane" aria-label="Список записей"><nav aria-label="Разделы" id="nav"></nav><div class="page-heading"><div><h1 id="page-title"></h1><div class="muted" id="page-sub"></div></div><button class="primary" id="create">＋ Новая задача</button></div><div class="toolbar"><div class="search"><span>⌕</span><input id="search" placeholder="Поиск по задачам" aria-label="Поиск по текущему разделу"></div><div class="list-meta"><span id="list-label">План на сегодня</span><button id="sort">По рейтингу ↓</button></div></div><div class="scroll-list" id="list"></div></aside><section class="detail" id="detail" aria-label="Детали выбранного объекта"></section></div>
<div class="footer"><span>Демонстрационные данные · 15 сентября 2026 · Москва, UTC+3</span><span>Список и детали · нажмите на карточку, чтобы посмотреть сценарий</span></div></main>
<div id="toast" class="toast hidden" role="status"></div><div id="menu" class="mock-menu hidden"><strong>Настройки</strong><p class="muted">В рабочем интерфейсе здесь будет переход в панель сервера.</p><button id="refresh">Обновить данные</button><button id="problem">Показать пример ошибки системы</button></div>
<script>
const $=id=>document.getElementById(id);
const sections=['Задачи','Встречи','Итоги','Переписки','Статус'];
const titles=['План на сегодня','Предстоящие встречи','Результаты встреч','Резюме переписок','Состояние компонентов'];
const subtitles=['Вторник, 15 сентября · 2 встречи и 3 задачи','Подготовка, повестка и материалы для обсуждения','Решения и договорённости с подтверждёнными источниками','Главное из сообщений — с переходом к оригиналу','Загрузчики, обработка и доступность сервисов'];
const data={
0:[{id:'meeting',group:'Встречи сегодня',title:'Синхронизация по проекту «Орион»',sub:'11:30–12:00 · Организатор Анна Белова',type:'meeting',tag:'Через 45 минут'},{id:'review',group:'Встречи сегодня',title:'Архитектурный разбор интеграции',sub:'14:00–15:00 · Переговорная / МТС Линк',type:'meeting',tag:'Контекст готов'},{id:'task',group:'Задачи',title:'Согласовать состав сервисов для пилота',sub:'Сегодня, 13:00 · Рабочая почта',type:'task',tag:'Высокий',preview:'Нужно подтвердить перечень сервисов и ограничения первого этапа.'},{id:'confirm',group:'Задачи',title:'Подготовить оценку сроков интеграции',sub:'Завтра, 16:00 · Из переписки',type:'task',tag:'Подтвердить',preview:'Qwen нашёл поручение. Проверьте основание назначения.'},{id:'plan',group:'Задачи',title:'Обновить план запуска пилота',sub:'18 сентября · Создана вручную',type:'task',tag:'Обычный'}],
1:[{id:'meeting',group:'Сегодня · 15 сентября',title:'Синхронизация по проекту «Орион»',sub:'11:30–12:00 · Анна Белова',type:'meeting',tag:'Контекст готов'},{id:'review',group:'Сегодня · 15 сентября',title:'Архитектурный разбор интеграции',sub:'14:00–15:00 · Алексей Орлов',type:'meeting',tag:'Контекст готов'},{id:'future',group:'Завтра · 16 сентября',title:'Планирование следующего этапа',sub:'10:00–11:00 · Анна Белова',type:'meeting',tag:'Контекст не запрошен'}],
2:[{id:'result',group:'14 сентября',title:'Синхронизация по проекту «Орион»',sub:'11:30–12:00 · Связано с календарём',type:'result',tag:'2 дополнения',preview:'Согласовали границы пилота. Открыт вопрос по составу сервисов.'},{id:'result2',group:'14 сентября',title:'Архитектурный разбор интеграции',sub:'15:00–16:00 · МТС Линк',type:'result',tag:'Анализ готов',preview:'Выбрали схему обмена данными и определили следующий шаг.'}],
3:[{id:'thread',group:'Сегодня',title:'Согласование сервисов для пилота',sub:'Рабочая почта · 8 сообщений · 10:12',type:'thread',tag:'Есть задача',preview:'Анна прислала уточнённый список. Требуется подтвердить два ограничения.'},{id:'thread2',group:'Вчера',title:'Оценка сроков интеграции',sub:'Рабочая почта · 5 сообщений · 17:40',type:'thread',preview:'Команда уточнила зависимости и ожидает предварительную оценку.'}]
};
let current=0,selected='task',query='',sortReverse=false,problem=false;const contexts=new Set();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function source(){return `<div class="source"><div class="eyebrow">ИСТОЧНИК · РАБОЧАЯ ПОЧТА</div><strong>Согласование сервисов для пилота</strong><p>Анна Белова · 15 сентября, 10:12</p><p>«Максим, прошу до 13:00 подтвердить перечень сервисов для пилота и указать ограничения. После согласования передадим состав команде запуска».</p><button data-action="original">Открыть оригинал письма ↗</button></div>`}
function head(kind){return `<div class="detail-head"><span class="eyebrow">${kind}</span></div>`}
function renderList(){let rows=(data[current]||[]).filter(x=>(x.title+' '+(x.preview||'')).toLowerCase().includes(query.toLowerCase()));if(sortReverse)rows=rows.slice().reverse();let group='';$('list').innerHTML=rows.map(x=>{let h='';if(x.group!==group){group=x.group;h=`<div class="group">${group}</div>`}return h+`<button class="item ${selected===x.id?'selected':''}" data-id="${x.id}"><div class="title">${esc(x.title)}</div><div class="sub">${esc(x.sub)}</div>${x.tag?`<div style="margin-top:9px"><span class="tag ${x.type==='meeting'?'blue':x.type==='result'?'green':''}">${esc(x.tag)}</span></div>`:''}${x.preview?`<div class="preview">${esc(x.preview)}</div>`:''}</button>`}).join('')||'<div class="blank">По запросу ничего не найдено</div>'}
function renderDetail(){const x=(data[current]||[]).find(x=>x.id===selected);if(!x)return;let html=head(x.type==='task'?'Задача / из переписки':x.type==='meeting'?'Подготовка к встрече':x.type==='result'?'Итоги / МТС Линк':'Переписка / рабочая почта');html+=`<h2>${esc(x.title)}</h2>`;
if(x.type==='task'){html+=`<div><span class="tag">${x.tag||'Обычный'}</span><span class="muted">${x.id==='confirm'?'Ожидает подтверждения':'В работе'}</span></div><div class="detail-actions"><button class="primary" data-action="complete">${x.id==='confirm'?'Подтвердить задачу':'✓ Завершить'}</button><button data-action="remind">◷ Напомнить</button>${x.id==='confirm'?'<button data-action="reject">Отклонить</button>':''}</div><div class="facts"><div class="fact"><span>Срок</span>${x.sub.split(' · ')[0]}</div><div class="fact"><span>Ответственный</span>Максим · maxim@example.test</div><div class="fact"><span>Источник</span>${x.id==='plan'?'Вручную':'Рабочая почта'}</div><div class="fact"><span>Приоритет</span>${x.tag||'Обычный'}</div></div><h3>Что нужно сделать</h3><p>${esc(x.preview||'Подготовить актуальный план с учётом последних договорённостей команды.')}</p><h3>Почему задача в плане</h3><div class="callout"><p>Срок близко. Результат нужен команде для продолжения подготовки пилота.</p></div>${x.id!=='plan'?'<h3>Основание назначения</h3>'+source():''}`}
if(x.type==='meeting'){const ready=x.id!=='future'||contexts.has(x.id);html+=`<div class="facts"><div class="fact"><span>Время · Москва</span>${x.id==='future'?'16 сентября, 10:00–11:00':x.sub.split(' · ')[0]}</div><div class="fact"><span>Организатор</span>Анна Белова</div><div class="fact"><span>Участники</span>Максим, Анна, Алексей · ещё 2</div><div class="fact"><span>Подключение</span><button class="link" data-action="join">Открыть встречу ↗</button></div></div><div class="detail-actions"><button class="primary" data-action="context">${ready?'Обновить контекст':'Создать контекст'}</button><button data-action="invite">Открыть приглашение</button></div>${ready?`<div class="muted">Подготовлено сегодня, 10:30 · 3 источника</div><h3>Главное к обсуждению</h3><div class="callout"><p>На прошлой встрече согласовали границы пилота. Сегодня нужно подтвердить состав сервисов и владельцев двух открытых вопросов.</p></div><h3>Действующие договорённости</h3><ul><li>Первый этап включает только базовый обмен данными. <button class="link" data-action="evidence">[1]</button></li><li>Оценку сроков команда уточнит после согласования перечня сервисов. <button class="link" data-action="evidence">[2]</button></li></ul><h3>Открытые вопросы</h3><p>Какие ограничения блокируют запуск? Кто подтвердит готовность смежной системы?</p><h3>Материалы для подготовки</h3>${source()}`:'<div class="callout"><p>Контекст ещё не запрашивался. Подготовка начнётся по кнопке и продолжится, даже если вы закроете страницу.</p></div>'}`}
if(x.type==='result'){html+=`<div class="muted">14 сентября · ${x.sub} · 5 участников</div><h3>Резюме встречи</h3><div class="callout"><p>${esc(x.preview)}</p></div><h3>Решения</h3><ul><li>Начать с базового сценария обмена данными.</li><li>После пилота рассмотреть дополнительные сервисы.</li></ul><h3>Договорённости</h3><p>Максим подтверждает состав сервисов. Анна собирает ограничения команды до следующей синхронизации.</p><div class="detail-actions"><button data-action="transcript">Открыть расшифровку</button><button data-action="calendar">Календарная встреча ↗</button></div><h3>Дополнения участников</h3>${source()}`}
if(x.type==='thread'){html+=`<div class="muted">${esc(x.sub)} · Анна Белова, Максим, Алексей Орлов</div><h3>Резюме Qwen</h3><div class="callout"><p>${esc(x.preview)} Последний ответ пока не содержит подтверждения согласования.</p></div><h3>Связанная задача</h3><button class="item" data-action="task"><div class="title">Согласовать состав сервисов для пилота</div><span class="tag">Высокий</span><span class="muted">Сегодня, 13:00 ↗</span></button><h3>Сообщения <span class="muted">· сначала новые</span></h3>${source()}<div class="source" style="margin-top:12px"><strong>Алексей Орлов</strong><p>Вчера, 17:40 · Входящее</p><p>Передали предварительный перечень ограничений. Просим учесть их при согласовании состава пилота.</p><button data-action="original">Открыть оригинал ↗</button></div>`}
$('detail').innerHTML=html}
function status(){const rows=[['Рабочая почта','Норма','10:44:12','60 с · загружено 3'],['МТС Линк','Норма','10:30:08','900 с · новых встреч 0'],['Загрузчик задач',problem?'Ошибка авторизации':'Норма','10:44:10',problem?'Нужно обновить доступ':'загружено 2'],['Ollama / Qwen','Занят','10:44:15','1 запрос выполняется'],['Обработка','Норма','10:44:15','ожидают 4 · ошибок 0'],['Семафор Ollama','Занят','10:44:15','занято 1 из 1 · ожидают 2']];$('detail').innerHTML=head('Мониторинг')+`<h2>${problem?'Загрузчику задач нужен доступ':'Все компоненты работают штатно'}</h2><p class="muted">Qwen обрабатывает запросы. Занятость модели не означает сбой.</p><div class="status-grid"><div class="metric"><strong>4</strong><span>События в очереди</span></div><div class="metric"><strong>${problem?'1':'0'}</strong><span>Ошибки компонентов</span></div><div class="metric"><strong>1 / 1</strong><span>Занято мест Ollama</span></div></div><div class="table-wrap"><table><thead><tr><th>КОМПОНЕНТ</th><th>СОСТОЯНИЕ</th><th>ОБНОВЛЕНО</th><th>ПОКАЗАТЕЛИ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td><span class="dot" style="${r[1].includes('Ошибка')?'background:#ee8d83':''}"></span>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>`}
function render(){document.querySelectorAll('nav button').forEach((b,i)=>{b.classList.toggle('active',current===i);b.setAttribute('aria-current',current===i?'page':'false')});$('page-title').textContent=titles[current];$('page-sub').textContent=subtitles[current];$('create').classList.toggle('hidden',current!==0);$('search').placeholder='Поиск по '+['задачам','встречам','итогам','перепискам'][current];$('sort').textContent=current===0?'По рейтингу ↓':'По времени ↓';$('list-label').textContent=current===0?'План на сегодня':'Все записи';if(current===4){$('list').innerHTML='<div class="blank">Состояние компонентов показано справа.</div>';status()}else{renderList();renderDetail()}}
function go(i,id){current=i;query='';$('search').value='';sortReverse=false;selected=id||(data[i]||[])[0]?.id;render()}
$('nav').innerHTML=sections.map((s,i)=>`<button data-tab="${i}">${s}${i<4?`<small>${[3,3,2,2][i]}</small>`:''}</button>`).join('');$('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)go(Number(b.dataset.tab))};$('list').onclick=e=>{const b=e.target.closest('[data-id]');if(b){selected=b.dataset.id;renderList();renderDetail();$('detail').scrollTop=0;}};$('search').oninput=e=>{query=e.target.value;renderList()};$('sort').onclick=()=>{sortReverse=!sortReverse;renderList();$('sort').textContent=sortReverse?'Обратный порядок ↑':'Исходный порядок ↓'};$('health').onclick=()=>go(4);$('settings').onclick=()=>$('menu').classList.toggle('hidden');$('refresh').onclick=()=>{notify('Демонстрация: данные обновлены');$('menu').classList.add('hidden')};$('problem').onclick=()=>{problem=!problem;$('health').innerHTML=`<span class="dot" style="${problem?'background:#ee8d83':''}"></span><span class="health-label">${problem?'Есть проблема':'Система в норме'}</span>`;$('menu').classList.add('hidden');go(4)};
$('detail').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'task':go(0,'task');;break;case'calendar':go(1,'meeting');;break;case'context':{const requested=selected;b.disabled=true;b.textContent='Контекст готовится…';notify('Демонстрация фоновой подготовки');setTimeout(()=>{contexts.add(requested);for(const rows of Object.values(data)){for(const row of rows){if(row.id===requested)row.tag='Контекст готов'}}if(current<4){renderList();if(selected===requested)renderDetail()}notify('Демонстрация: контекст готов')},1400);break;}case'complete':b.textContent='✓ Готово';b.disabled=true;notify('Демонстрация: действие выполнено');break;case'original':case'evidence':case'invite':case'transcript':notify('Скетч: здесь откроется полный первоисточник');break;case'join':notify('Скетч: переход по ссылке подключения');break;case'remind':notify('Скетч: выбор даты и времени напоминания');break;case'reject':notify('Демонстрация: задача отклонена');break;case'send':{const text=$('message').value.trim();if(text){const div=document.createElement('div');div.className='bubble user';div.textContent=text;$('chat-log').appendChild(div);$('message').value='';notify('Скетч: вопрос поставлен в очередь Qwen')}break}}};
$('chat').onclick=()=>{$('page-title').textContent='Чат с Qwen';$('page-sub').textContent='Ответы, договорённости и задачи из вашего архива';$('create').classList.add('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));$('detail').innerHTML=head('Чат / пример ответа')+`<div class="chat-answer"><div id="chat-log"><div class="bubble user">Что осталось согласовать перед запуском пилота «Орион»?</div><h2>Два открытых вопроса</h2><p>По последней встрече и переписке осталось подтвердить:</p><ol><li><strong>Состав сервисов.</strong> Максим должен согласовать перечень сегодня до 13:00. <button class="link" data-action="task">[1]</button></li><li><strong>Ограничения интеграции.</strong> Команда ожидает уточнений перед оценкой сроков. <button class="link" data-action="evidence">[2]</button></li></ol><h3>Источники</h3>${source()}</div><div class="composer"><textarea id="message" aria-label="Вопрос Qwen" placeholder="Уточнить по задачам и переписке…"></textarea><button class="primary" data-action="send">Отправить ↑</button></div><p class="muted" style="margin-top:12px">Демонстрация · запросы не отправляются на сервер</p></div>`};
$('create').onclick=()=>notify('Скетч: форма новой задачи — название, приоритет и срок');render();
</script>
</body></html>
