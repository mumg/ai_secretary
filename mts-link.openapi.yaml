        eventPauseImage: { $ref: "#/components/schemas/FileAsset" }
        interfaceLogoImage: { $ref: "#/components/schemas/FileAsset" }
        landingLogoImage: { $ref: "#/components/schemas/FileAsset" }
      additionalProperties: true

    ProjectsEnvelope:
      type: object
