        provider:
          type: string
          description: Push provider; `gms` was observed on Android.
        sessionId:
          type: string
          description: May be an empty string; it was empty in the capture.
        token:
          type: string
          writeOnly: true
          x-sensitive: true

    NetworkIdentity:
